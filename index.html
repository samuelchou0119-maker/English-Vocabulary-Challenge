<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎈 英語單字大冒險 🎈</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #FF6B6B;
      --primary-hover: #FF5252;
      --secondary: #4ECDC4;
      --accent: #FFE66D;
      --bg: #E8F5E9;
      --card-bg: #FFFFFF;
      --text: #2F3E46;
      --success: #2ECC71;
      --error: #FF4757;
    }

    * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Chalkboard SE', '微軟正黑體', sans-serif; }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(#A5D6A7 2px, transparent 2px);
      background-size: 24px 24px;
      color: var(--text);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 0px #C8E6C9, 0 16px 28px rgba(0, 0, 0, 0.1);
      border: 4px solid #81C784;
      position: relative;
    }

    .player-profile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFF9C4;
      border: 2px solid #FFE082;
      padding: 8px 12px;
      border-radius: 16px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      font-weight: bold;
      gap: 4px;
    }

    .player-name-tag {
      color: #D35400;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .xp-bar-container {
      width: 45px;
      height: 10px;
      background: #E0E0E0;
      border-radius: 6px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-left: 2px;
    }

    .xp-bar { height: 100%; background: #FF9800; width: 0%; transition: width 0.3s; }

    .btn-top-group { display: flex; gap: 4px; }

    .btn-top {
      color: white; border: none; border-radius: 12px; padding: 6px 8px;
      font-size: 0.8rem; font-weight: bold; cursor: pointer; transition: all 0.1s;
    }
    .btn-top:active { transform: translateY(2px); }
    .btn-badge-top { background: #9B59B6; box-shadow: 0 3px 0px #8E44AD; }
    .btn-dict-top { background: #27AE60; box-shadow: 0 3px 0px #1E8449; }

    h1 {
      text-align: center; margin: 0 0 16px 0; color: var(--primary);
      font-size: 1.8rem; text-shadow: 2px 2px 0px var(--accent);
    }

    .mascot-box {
      display: flex; align-items: center; gap: 12px; background: #E1F5FE;
      border: 2px solid #81D4FA; padding: 10px 14px; border-radius: 18px;
      margin-bottom: 16px; cursor: pointer; user-select: none; position: relative;
    }

    .mascot-avatar {
      font-size: 2.5rem; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .mascot-avatar.pop-success { animation: mascotPop 0.6s ease-in-out; }

    @keyframes mascotPop {
      0% { transform: scale(1) rotate(0deg); }
      30% { transform: scale(1.6) rotate(-15deg); }
      60% { transform: scale(1.4) rotate(15deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .mascot-bubble { font-weight: bold; color: #0277BD; font-size: 0.95rem; }

    .mascot-selector-wrapper { display: flex; gap: 6px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
    .mascot-opt-btn {
      background: #FFF; border: 2px solid #E0E0E0; border-radius: 12px;
      font-size: 1.4rem; padding: 4px 6px; cursor: pointer; transition: all 0.15s;
    }
    .mascot-opt-btn.active { border-color: var(--primary); background: #FFEEEF; box-shadow: 0 3px 0px var(--primary); }

    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #388E3C; }

    select, input[type="text"].input-field {
      width: 100%; padding: 10px; border-radius: 14px; border: 3px solid #A5D6A7;
      font-size: 1rem; outline: none; background-color: #F1F8E9; font-weight: bold; color: var(--text);
    }

    .btn {
      width: 100%; padding: 12px; background: var(--primary); color: white;
      border: none; border-radius: 16px; font-size: 1.15rem; font-weight: bold;
      cursor: pointer; box-shadow: 0 6px 0px #D63031; transition: all 0.1s ease; margin-top: 8px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0px #D63031; }

    .btn-quit { background: #FF9F43; box-shadow: 0 4px 0px #EE5253; padding: 10px; font-size: 0.95rem; margin-top: 16px; }
    .btn-reset { background: #A0AEC0; box-shadow: 0 4px 0px #718096; padding: 8px; font-size: 0.85rem; margin-top: 14px; }

    .btn-review { background: #FFA502; box-shadow: 0 6px 0px #CC8E00; margin-bottom: 8px; }
    .btn-hint { background: #20BF6B; box-shadow: 0 4px 0px #26DE81; padding: 8px; font-size: 0.95rem; margin-top: 6px; }

    .quit-note { text-align: center; font-size: 0.8rem; color: #888; margin-top: 4px; font-weight: bold; }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
      font-weight: bold; font-size: 1rem; background: #E8F8F5; padding: 8px 14px;
      border-radius: 12px; border: 2px dashed var(--secondary);
    }

    .combo-badge { color: #E67E22; font-weight: 900; animation: pulse 0.8s infinite alternate; }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }

    .question-box {
      background: #FFF9C4; border-radius: 20px; padding: 20px 16px; text-align: center;
      margin-bottom: 16px; border: 3px solid #FFF59D; box-shadow: 0 6px 0px #FFEE58;
      display: flex; align-items: center; justify-content: center; gap: 12px;
    }

    .prompt-text { font-size: 1.9rem; font-weight: bold; color: #D35400; word-break: break-word; }

    .speaker-btn {
      background: var(--accent); border: 2px solid #F1C40F; border-radius: 50%;
      width: 44px; height: 44px; font-size: 1.4rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0px #F39C12;
    }

    .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .option-btn {
      padding: 12px; background: #FFF; border: 3px solid #E0E0E0; border-radius: 16px;
      font-size: 1.1rem; font-weight: bold; cursor: pointer; text-align: center;
      box-shadow: 0 4px 0px #BDBDBD; color: #333;
    }
    .option-btn:hover { border-color: var(--secondary); background: #E0F2F1; }

    .spelling-box { display: flex; flex-direction: column; gap: 10px; }
    .spelling-input {
      padding: 12px; font-size: 1.3rem; border: 3px solid #A5D6A7; border-radius: 16px;
      text-align: center; outline: none; letter-spacing: 2px; font-weight: bold;
    }

    .feedback { margin-top: 12px; text-align: center; font-weight: bold; font-size: 1.2rem; min-height: 28px; }
    .correct { color: var(--success); }
    .incorrect { color: var(--error); }
    .hidden { display: none !important; }

    .results-box { text-align: center; padding: 10px 0; }
    .score-display { font-size: 3.2rem; color: var(--primary); font-weight: bold; margin: 8px 0; text-shadow: 2px 2px 0px var(--accent); }

    .wrong-list-container {
      margin: 14px 0; text-align: left; background: #FFEBEE; border: 2px solid #FFCDD2;
      border-radius: 16px; padding: 12px; max-height: 160px; overflow-y: auto;
    }
    .wrong-list-title { font-weight: bold; color: var(--error); margin-bottom: 6px; }
    .wrong-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #EF9A9A; font-size: 0.95rem; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 999;
    }
    .modal-content {
      background: white; border-radius: 20px; border: 4px solid #81C784; padding: 20px;
      width: 90%; max-width: 460px; max-height: 85vh; overflow-y: auto; position: relative;
    }
    .modal-title { font-size: 1.4rem; font-weight: bold; color: #8E44AD; text-align: center; margin-bottom: 12px; }

    .dict-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .dict-tab-btn {
      flex: 1; padding: 8px 4px; border: 2px solid #A5D6A7; border-radius: 10px;
      background: #F1F8E9; font-weight: bold; font-size: 0.85rem; cursor: pointer; color: var(--text);
    }
    .dict-tab-btn.active { background: #27AE60; color: white; border-color: #1E8449; }

    .dict-search-input {
      width: 100%; padding: 8px 12px; border-radius: 10px; border: 2px solid #CBD5E0;
      font-size: 0.95rem; outline: none; margin-bottom: 12px;
    }

    .dict-word-grid { display: grid; grid-template-columns: 1fr; gap: 8px; max-height: 320px; overflow-y: auto; }
    .dict-card {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
      border-radius: 12px; border: 2px solid #E2E8F0; background: #F8FAFC;
    }
    .dict-card-en { font-weight: bold; font-size: 1.1rem; color: var(--primary); }
    .dict-card-zh { color: #4A5568; font-size: 0.95rem; }
    .dict-audio-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; }

    .badge-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .badge-card { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; border: 2px solid #E0E0E0; background: #F9F9F9; opacity: 0.6; }
    .badge-card.unlocked { opacity: 1; background: #FFFDE7; border-color: #FBC02D; box-shadow: 0 4px 0px #FDD835; }
    .badge-card-icon { font-size: 2.2rem; }
    .badge-card-info { text-align: left; }
    .badge-card-name { font-weight: bold; font-size: 1.05rem; color: #333; }
    .badge-card-desc { font-size: 0.85rem; color: #666; margin-top: 2px; }
    .badge-card-status { font-size: 0.8rem; font-weight: bold; color: #E67E22; margin-top: 4px; }
    .badge-card.unlocked .badge-card-status { color: #27AE60; }
  </style>
</head>
<body>

  <div class="container">
    <div class="player-profile">
      <span class="player-name-tag">👤 <span id="profile-name">玩家1</span></span>
      <span>🔥 <span id="streak-days">1</span>天</span>
      <span>⭐ LV.<span id="player-level">1</span>
        <div class="xp-bar-container"><div class="xp-bar" id="xp-bar"></div></div>
      </span>
      <div class="btn-top-group">
        <button class="btn-top btn-dict-top" id="open-dict-modal-btn">📖 單字庫</button>
        <button class="btn-top btn-badge-top" id="open-badge-modal-btn">🏆 成就館</button>
      </div>
    </div>

    <div class="mascot-box" id="mascot-interactive-box">
      <div class="mascot-avatar" id="mascot-avatar">🐱</div>
      <div class="mascot-bubble" id="mascot-text">準備好了嗎？點擊 🔊 可以聽發音喔！</div>
    </div>

    <h1>🎈 英語單字大冒險 🎈</h1>

    <div id="setup-screen">
      <!-- 多玩家存檔切換欄與自訂命名框 -->
      <div style="background: #EBF8FF; padding: 12px; border-radius: 16px; border: 2px solid #90CDF4; margin-bottom: 14px;">
        <div class="form-group" style="margin-bottom: 8px;">
          <label for="player-select" style="color: #2B6CB0;">📁 選擇玩家存檔槽：</label>
          <select id="player-select">
            <option value="player1">存檔 1</option>
            <option value="player2">存檔 2</option>
            <option value="player3">存檔 3</option>
          </select>
        </div>
        <div>
          <label for="player-name-input" style="color: #2B6CB0;">✏️ 玩家名字 / 暱稱：</label>
          <input type="text" id="player-name-input" class="input-field" placeholder="請輸入名字..." maxlength="8">
        </div>
      </div>

      <div class="form-group">
        <label>🐾 選擇你的吉祥物夥伴：</label>
        <div class="mascot-selector-wrapper" id="mascot-selector">
          <button class="mascot-opt-btn" data-icon="🐱" data-name="小貓咪">🐱</button>
          <button class="mascot-opt-btn" data-icon="🐶" data-name="小柴犬">🐶</button>
          <button class="mascot-opt-btn" data-icon="🐰" data-name="粉紅兔">🐰</button>
          <button class="mascot-opt-btn" data-icon="🐻" data-name="小熊熊">🐻</button>
          <button class="mascot-opt-btn" data-icon="🐧" data-name="小企鵝">🐧</button>
          <button class="mascot-opt-btn" data-icon="🐷" data-name="小豬豬">🐷</button>
          <button class="mascot-opt-btn" data-icon="🐸" data-name="小青蛙">🐸</button>
        </div>
      </div>

      <div class="form-group">
        <label for="grade-select">🎯 選擇挑戰題庫：</label>
        <select id="grade-select">
          <optgroup label="🌟 校園課程單字">
            <option value="all">全校園混合挑戰</option>
            <option value="grade1">一年級</option>
            <option value="grade2">二年級</option>
            <option value="grade3">三年級</option>
            <option value="grade4">四年級</option>
            <option value="grade5">五年級</option>
            <option value="grade6">六年級</option>
          </optgroup>
          <optgroup label="🏆 小學英檢 (GEPT Kids)">
            <option value="gept_all">小學英檢 - 完整題庫</option>
            <option value="gept_easy">小學英檢 - 基礎單字</option>
            <option value="gept_hard">小學英檢 - 進階單字</option>
          </optgroup>
        </select>
      </div>

      <div class="form-group">
        <label for="mode-select">🎮 選擇玩法模式：</label>
        <select id="mode-select">
          <option value="choice-en-zh">📖 看英文選中文 (+10 XP)</option>
          <option value="choice-zh-en">🔤 看中文選英文 (+10 XP)</option>
          <option value="listening">🎧 聽力大考驗 (聽發音選英文 +10 XP)</option>
          <option value="spelling">✍️ 小英雄拼字大考驗 (雙倍 +20 XP!)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="count-select">🔢 題目數量：</label>
        <select id="count-select">
          <option value="10">10 題 (快速挑戰)</option>
          <option value="20">20 題 (標準挑戰)</option>
          <option value="50">50 題 (大師挑戰)</option>
        </select>
      </div>

      <button class="btn" id="start-btn">🚀 開始冒險！</button>
      <button class="btn btn-reset" id="reset-player-btn">🗑️ 重置【<span id="reset-target-name">當前玩家</span>】紀錄</button>
    </div>

    <div id="game-screen" class="hidden">
      <div class="header-bar">
        <span>⭐ 進度：<span id="current-index">1</span>/<span id="total-count">10</span></span>
        <span id="combo-display-box" class="combo-badge hidden">🔥 Combo x<span id="combo-count">0</span></span>
        <span>🏆 得分：<span id="score">0</span></span>
      </div>

      <div class="question-box">
        <div class="prompt-text" id="prompt-display">---</div>
        <button class="speaker-btn" id="speak-btn" title="聽發音">🔊</button>
      </div>

      <div id="choice-container" class="options-grid"></div>

      <div id="spelling-container" class="spelling-box hidden">
        <input type="text" id="spelling-input" class="spelling-input" placeholder="在這裡拼出英文單字..." autocomplete="off">
        <button class="btn btn-hint" id="hint-btn">💡 使用提示 (-2分)</button>
        <button class="btn" id="submit-spelling-btn">✨ 送出答案</button>
      </div>

      <div id="feedback" class="feedback"></div>

      <button class="btn btn-quit" id="quit-game-btn">🏠 中途返回主選單</button>
      <div class="quit-note">⚠️ 說明：中途離開本次答對單字將不計入成就與已學會總庫喔！</div>
    </div>

    <div id="result-screen" class="hidden">
      <div class="results-box">
        <h2>🎉 冒險完成！ 🎉</h2>
        <p>你的最終得分：</p>
        <div class="score-display" id="final-score">0</div>

        <div id="wrong-list-box" class="wrong-list-container hidden">
          <div class="wrong-list-title">📝 需要再加油的單字（共 <span id="wrong-count">0</span> 個）：</div>
          <div id="wrong-list-items"></div>
        </div>

        <button class="btn btn-review hidden" id="review-btn">🔥 針對錯題重新練習</button>
        <button class="btn" id="restart-btn">🏠 返回主選單</button>
      </div>
    </div>
  </div>

  <div id="dict-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-title">📖 探索單字總庫 📖</div>
      <div class="dict-tabs">
        <button class="dict-tab-btn active" data-tab="school">🏫 學校單字</button>
        <button class="dict-tab-btn" data-tab="gept">🏆 小學英檢</button>
        <button class="dict-tab-btn" data-tab="mastered">🌟 我已學會 (<span id="mastered-count-badge">0</span>)</button>
      </div>

      <div id="dict-sub-grade-box" class="form-group">
        <select id="dict-grade-select">
          <option value="grade1">一年級單字</option>
          <option value="grade2">二年級單字</option>
          <option value="grade3">三年級單字</option>
          <option value="grade4">四年級單字</option>
          <option value="grade5">五年級單字</option>
          <option value="grade6">六年級單字</option>
        </select>
      </div>

      <input type="text" id="dict-search-input" class="dict-search-input" placeholder="🔍 搜尋英文或中文單字..." autocomplete="off">
      <div class="dict-word-grid" id="dict-word-grid"></div>
      <button class="btn" id="close-dict-modal-btn" style="margin-top: 16px;">關閉單字庫</button>
    </div>
  </div>

  <div id="badge-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-title">🏆 我的成就徽章館 🏆</div>
      <div class="badge-grid" id="badge-modal-grid"></div>
      <button class="btn" id="close-badge-modal-btn" style="margin-top: 16px;">關閉成就館</button>
    </div>
  </div>

  <script>

      const defaultName = playerKey === 'player1' ? '玩家1' : (playerKey === 'player2' ? '玩家2' : '玩家3');
      return data ? JSON.parse(data) : createDefaultPlayerData(defaultName);

        setMascot(pData.selectedMascot.icon, `【${pData.playerName}】紀錄已歸零！重新開始冒險吧！`);

    function checkDailyStreak() {
      const today = new Date().toDateString();
      if (pData.lastLogin !== today) {
        if (pData.lastLogin) {
          const last = new Date(pData.lastLogin);
          const diff = Math.floor((new Date() - last) / (1000 * 60 * 60 * 24));
          pData.streak = (diff === 1) ? pData.streak + 1 : 1;
        }
        pData.lastLogin = today;
        savePlayerData();
      }
    }

    function addXP(amount) {
      pData.xp += amount;
      const nextLevelXP = pData.level * 50;
      if (pData.xp >= nextLevelXP) {
        pData.xp -= nextLevelXP;
        pData.level++;
        triggerMascotAnimation(pData.selectedMascot.icon, `Level Up! 你升級到 LV.${pData.level} 囉！`);
      }
      savePlayerData();
    }

    function updateProfileUI() {
      document.getElementById('profile-name').textContent = pData.playerName;
      document.getElementById('reset-target-name').textContent = pData.playerName;
      document.getElementById('streak-days').textContent = pData.streak;
      document.getElementById('player-level').textContent = pData.level;
      const nextXP = pData.level * 50;
      document.getElementById('xp-bar').style.width = Math.min(100, (pData.xp / nextXP) * 100) + '%';

      const masteredCount = Object.keys(pData.masteredWords).length;
      document.getElementById('mastered-count-badge').textContent = masteredCount;

      if (pData.streak >= 3) pData.badges.streak3 = true;
      if (pData.streak >= 7) pData.badges.streak7 = true;
      if (pData.streak >= 10) pData.badges.streak10 = true;
      if (pData.streak >= 30) pData.badges.streak30 = true;
      if (pData.streak >= 50) pData.badges.streak50 = true;
      if (pData.streak >= 100) pData.badges.streak100 = true;
      if (pData.streak >= 200) pData.badges.streak200 = true;
      if (pData.streak >= 365) pData.badges.streak365 = true;
      if (pData.correctTotal >= 50) pData.badges.master50 = true;
      if (pData.correctTotal >= 200) pData.badges.master200 = true;

      let allSchoolCount = 0;
      Object.values(schoolWords).forEach(l => allSchoolCount += l.length);
      let masteredSchoolCount = 0;
      Object.values(schoolWords).forEach(l => {
        l.forEach(w => { if (pData.masteredWords[w.en]) masteredSchoolCount++; });
      });
      if (masteredSchoolCount >= allSchoolCount && allSchoolCount > 0) pData.badges.schoolGrand = true;

      let masteredGeptCount = geptWords.filter(w => pData.masteredWords[w.en]).length;
      if (masteredGeptCount >= geptWords.length && geptWords.length > 0) pData.badges.geptGrand = true;
    }

    function renderDictModal() {
      const query = dictSearchInput.value.trim().toLowerCase();
      let pool = [];

      if (currentDictTab === 'school') {
        pool = schoolWords[dictGradeSelect.value] || [];
      } else if (currentDictTab === 'gept') {
        pool = geptWords;
      } else if (currentDictTab === 'mastered') {
        let allPool = [...geptWords];
        Object.values(schoolWords).forEach(l => allPool.push(...l));
        pool = allPool.filter(w => pData.masteredWords[w.en]);
      }

      if (query) {
        pool = pool.filter(w => w.en.toLowerCase().includes(query) || w.zh.includes(query));
      }

      dictGrid.innerHTML = '';
      if (pool.length === 0) {
        dictGrid.innerHTML = '<div style="text-align:center; padding: 20px; color:#888;">查無相關單字卡片喔！</div>';
        return;

      pool.forEach(w => {
        const card = document.createElement('div');
        card.className = 'dict-card';

    function startGame(isReview = false) {
      currentMode = modeSelect.value;

      updateComboUI();

        currentQuizList = shuffle([...wrongWords]);
      } else {
        const selectedKey = gradeSelect.value;

        if (selectedKey === 'all') Object.values(schoolWords).forEach(l => pool.push(...l));
        else if (selectedKey === 'gept_all') pool = geptWords;
        else if (selectedKey === 'gept_easy') pool = geptWords.filter(w => w.en.length <= 5);
        else if (selectedKey === 'gept_hard') pool = geptWords.filter(w => w.en.length > 5);
        else pool = schoolWords[selectedKey] || [];

        if (pool.length === 0) return alert('該題庫尚無可用單字！');

        let unseenItems = pool.filter(w => !pData.seenWords[w.en]);
        let wrongMemoryKeys = Object.keys(pData.wrongMemory);
        let memoryItems = pool.filter(w => wrongMemoryKeys.includes(w.en));
        let masteredItems = pool.filter(w => pData.seenWords[w.en] && !wrongMemoryKeys.includes(w.en));

        if (unseenItems.length === 0) {
          pool.forEach(w => delete pData.seenWords[w.en]);
          unseenItems = [...pool]; memoryItems = []; masteredItems = [];
        }

        let prioritizedPool = [...shuffle(unseenItems), ...shuffle(memoryItems), ...shuffle(masteredItems)];
        currentQuizList = prioritizedPool.slice(0, Math.min(questionCount, prioritizedPool.length));

        currentQuizList.forEach(w => pData.seenWords[w.en] = true);
        savePlayerData();
      }

      currentIndex = 0; score = 0; wrongWords = [];
      setupScreen.classList.add('hidden'); resultScreen.classList.add('hidden'); gameScreen.classList.remove('hidden');

      totalCountDisplay.textContent = currentQuizList.length; scoreDisplay.textContent = score;
      triggerMascotAnimation(pData.selectedMascot.icon, '保持專注！點擊 🔊 可以聽發音喔！');
      loadQuestion();
    }

    function loadQuestion() {
      isAnswered = false; feedback.textContent = ''; feedback.className = 'feedback'; spellingInput.value = '';

      const q = currentQuizList[currentIndex];
      currentIndexDisplay.textContent = currentIndex + 1;

      if (currentMode === 'choice-en-zh') {
        promptDisplay.textContent = q.en; setupChoices(q, 'zh');
      } else if (currentMode === 'choice-zh-en') {
        promptDisplay.textContent = q.zh; setupChoices(q, 'en');
      } else if (currentMode === 'listening') {
        promptDisplay.textContent = "🔊 聽發音猜單字"; setupChoices(q, 'listening_bilingual');
        speakWord(q.en);
      } else if (currentMode === 'spelling') {
        promptDisplay.textContent = q.zh;
        choiceContainer.classList.add('hidden'); spellingContainer.classList.remove('hidden');
        spellingInput.focus();
      }
    }

    function setupChoices(correctItem, targetKey) {
      spellingContainer.classList.add('hidden'); choiceContainer.classList.remove('hidden'); choiceContainer.innerHTML = '';
      let allWords = [...geptWords]; Object.values(schoolWords).forEach(l => allWords.push(...l));
      let wrongPool = shuffle(allWords.filter(w => w.en !== correctItem.en)).slice(0, 3);
      let options = shuffle([correctItem, ...wrongPool]);

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        if (targetKey === 'listening_bilingual') {
          btn.textContent = `${opt.en} (${opt.zh})`;
        } else {
          btn.textContent = opt[targetKey];
        }
        btn.addEventListener('click', () => handleChoiceSelect(opt, correctItem));
        choiceContainer.appendChild(btn);
      });
    }

    function giveSpellingHint() {
      if (isAnswered) return;
      const q = currentQuizList[currentIndex];
      spellingInput.value = q.en.charAt(0) + ' _ '.repeat(q.en.length - 1).trim();
      triggerMascotAnimation('💡', `提示第一個字母是 '${q.en.charAt(0).toUpperCase()}'！`);
    }

    function handleChoiceSelect(selectedItem, correctItem) {
      if (isAnswered) return;
      isAnswered = true;

      if (selectedItem.en === correctItem.en) handleCorrectAnswer(correctItem);
      else handleWrongAnswer(correctItem, currentMode === 'choice-en-zh' ? correctItem.zh : `${correctItem.en} (${correctItem.zh})`);
    }

    function handleSpellingSubmit() {
      if (isAnswered) return;
      const userInput = spellingInput.value.trim().toLowerCase();
      if (!userInput) return;

      isAnswered = true;
      const q = currentQuizList[currentIndex];

      if (userInput === q.en.toLowerCase()) handleCorrectAnswer(q);
      else handleWrongAnswer(q, q.en);
    }

    function updateComboUI() {
      const box = document.getElementById('combo-display-box');
      const countEl = document.getElementById('combo-count');
      if (comboCount >= 2) {
        countEl.textContent = comboCount;
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
      }
    }

    function handleCorrectAnswer(item) {
      score += 10; comboCount++; updateComboUI();

      let baseXP = (currentMode === 'spelling') ? 20 : 10;
      let bonusXP = 0;
      if (comboCount >= 5) bonusXP = 10;
      else if (comboCount >= 3) bonusXP = 5;

      addXP(baseXP + bonusXP);
      pData.correctTotal++;
      pData.masteredWords[item.en] = true;

      let praiseText = mascotPraisePhrases[Math.floor(Math.random() * mascotPraisePhrases.length)];
      if (comboCount >= 5) praiseText = `⚡ 熱血 Combo x${comboCount}! XP加倍！`;
      else if (comboCount >= 3) praiseText = `🔥 連對 Combo x${comboCount}! XP加成！`;

      feedback.textContent = `🎉 太棒了！答對囉！(+${baseXP + bonusXP} XP)`; 
      feedback.className = 'feedback correct';

      triggerMascotAnimation(pData.selectedMascot.icon, `🎉 ${praiseText}`);

      if (pData.wrongMemory[item.en]) {
        pData.wrongMemory[item.en]++;
        if (pData.wrongMemory[item.en] >= 3) delete pData.wrongMemory[item.en];
      }
      savePlayerData(); scoreDisplay.textContent = score; nextQuestionWithDelay();
    }

    function handleWrongAnswer(item, correctText) {
      comboCount = 0; updateComboUI();
      wrongWords.push(item);
      pData.wrongMemory[item.en] = 0; savePlayerData();
      feedback.textContent = `❌ 正確答案是：${correctText}`; feedback.className = 'feedback incorrect';
      setMascot(pData.selectedMascot.icon, '沒關係，記下來下次一定會答對！');
      scoreDisplay.textContent = score; nextQuestionWithDelay();
    }

    function nextQuestionWithDelay() {
      setTimeout(() => {
        currentIndex++;
        if (currentIndex < currentQuizList.length) loadQuestion();
        else endGame();
      }, 1600);
    }

    function endGame() {
      gameScreen.classList.add('hidden'); resultScreen.classList.remove('hidden');
      finalScoreDisplay.textContent = score; pData.badges.first = true;

      if (currentMode === 'spelling' && score >= 80) pData.badges.spelling = true;

      if (wrongWords.length === 0) {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        triggerMascotAnimation(pData.selectedMascot.icon, '大滿分！你真是英語小天才！');
      } else {
        setMascot(pData.selectedMascot.icon, '挑戰完成！來複習一下剛剛答錯的字吧！');
      }

      savePlayerData();

      if (wrongWords.length > 0) {
        wrongCountDisplay.textContent = wrongWords.length; wrongListItems.innerHTML = '';
        wrongWords.forEach(w => {
          const item = document.createElement('div');
          item.className = 'wrong-item';
          item.innerHTML = `<span><strong>${w.en}</strong></span><span>${w.zh}</span>`;
          wrongListItems.appendChild(item);
        });
        wrongListBox.classList.remove('hidden'); reviewBtn.classList.remove('hidden');
      } else {
        wrongListBox.classList.add('hidden'); reviewBtn.classList.add('hidden');
      }
    }

    function resetToSetup() {
      gameScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      setupScreen.classList.remove('hidden');
      setMascot(pData.selectedMascot.icon, '準備好了嗎？點擊 🔊 可以聽發音喔！');
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    checkDailyStreak(); initMascotSelector(); updateProfileUI();
    setMascot(pData.selectedMascot.icon, `哈囉！我是${pData.selectedMascot.name}，很高興陪你學習！`);
  </script>
</body>
</html>
